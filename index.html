<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>미국 주요 지수별 섹터/산업군 가중평균 등락률</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 15px;
        background-color: #f4f4f4;
      }
      h1 {
        text-align: center;
        color: #333;
        margin-top: 10px;
        margin-bottom: 5px;
      }
      #timestamp {
        text-align: center;
        font-size: 0.85em;
        color: #777;
        margin-bottom: 15px;
      }

      /* 4개 지수 표를 가로로 늘어놓는 레이아웃 컨테이너 */
      .index-grid-container {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 10px;
      }

      /* 개별 지수 카드의 세부 스타일 */
      .index-card {
        flex: 1 1 320px;
        min-width: 300px;
        background: white;
        padding: 12px;
        border-radius: 8px;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.08);
      }

      .index-title {
        text-align: center;
        margin: 0 0 10px 0;
        padding: 8px;
        background-color: #212529;
        color: #fff;
        border-radius: 4px;
        font-size: 1.05em;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        padding: 6px 8px;
        text-align: left;
      }

      th {
        background-color: #495057;
        color: white;
        font-size: 0.85em;
      }

      /* 계층별 스타일, 글자 크기, 구분선 지정 */
      /* 1. Sector: 이중실선, 기준 글자 크기 */
      tr.sector-row {
        background-color: #e9ecef;
        font-weight: bold;
        font-size: 0.95em;
        border-top: 2px solid #6c757d;
        border-bottom: 3px double #333; 
      }

      /* 2. Industry: 단일실선, 작은 글자 크기 */
      tr.industry-row {
        background-color: #f8f9fa;
        font-weight: bold;
        font-size: 0.85em;
        border-bottom: 1px solid #adb5bd; 
      }

      /* 3. 종목 (Ticker): 더 작은 글자 크기 */
      tr.stock-row {
        background-color: #ffffff;
        font-size: 0.8em;
        border-bottom: 1px solid #f1f3f5;
      }

      tr.stock-row:hover {
        background-color: #f1f5f9;
      }

      .text-right { text-align: right; }
      .indent-1 { padding-left: 14px !important; }
      .indent-2 { padding-left: 24px !important; }

      /* 등락률 색상 지정 */
      .up { color: #d9534f; font-weight: bold; }
      .down { color: #0275d8; font-weight: bold; }
      .flat { color: #6c757d; }

      .loading { text-align: center; color: #888; padding: 40px; }
      .error { color: red; text-align: center; padding: 20px; }
    </style>
  </head>
  <body>
    <h1>미국 주요 지수별 Sector & Industry 가중평균 등락률</h1>
    <div id="timestamp">데이터를 불러오는 중입니다...</div>

    <div id="output">
      <div class="loading">S&P 500, NASDAQ, DOW, SOX 연동 데이터를 집계하고 있습니다...</div>
    </div>

    <script>
      const accessParams = {
        grant_type: "client_credentials",
        appkey: "6C5DEgrFBmeUtnQ6dwYFazZ_Aa3Tdia3agcS6rTkmic",
        secretkey: "xl5sKBl168QCieYJHAW7IgI-aefHGlD4txRCts-__CM",
      };

      const capitalParams = {
        stex_tp: "0",
        inds_cd: "000",
        stk_tp: "1",
        trde_qty_tp: "0",
        stk_cnd: "0",
        pric_cnd: "0",
        trde_prica_cnd: "0",
      };

      let cachedToken = null;
      function delay(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

      function updateTimestamp(text) {
        const elem = document.getElementById("timestamp");
        if (text) {
          elem.innerText = text;
        } else {
          const now = new Date();
          elem.innerText = `최종 업데이트: ${now.toLocaleTimeString()}`;
        }
      }

      // 1. 키움 토큰 발급
      async function fetchToken() {
        if (cachedToken) return cachedToken;
        const url = "https://mockapi.kiwoom.com/oauth2/token";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json;charset=UTF-8" },
          body: JSON.stringify(accessParams),
        });
        if (!res.ok) throw new Error(`토큰 발급 실패: ${res.status}`);
        const data = await res.json();
        cachedToken = data.token || data.access_token;
        return cachedToken;
      }

      // 2. 키움 미국 주식 시가총액 연속 조회 (최대 10회)
      async function fetchCapitalUSA(token) {
        const url = "https://mockapi.kiwoom.com/api/us/rkinfo";
        let allResults = [];
        let contYn = "N";
        let nextKey = "";
        let pageCount = 1;
        const maxPages = 10;

        while (pageCount <= maxPages) {
          updateTimestamp(`키움 API 데이터 요청 중... (${pageCount} / ${maxPages} 페이지)`);

          const res = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json;charset=UTF-8",
              authorization: `Bearer ${token}`,
              "api-id": "usa20550",
              "cont-yn": contYn,
              "next-key": nextKey,
            },
            body: JSON.stringify(capitalParams),
          });

          if (!res.ok) throw new Error(`미국 주식 데이터 조회 실패: ${res.status}`);

          const resContYn = res.headers.get("cont-yn") || res.headers.get("Cont-Yn");
          const resNextKey = res.headers.get("next-key") || res.headers.get("Next-Key");
          const data = await res.json();

          const items = (data.result_list || []).map((item) => ({
            stk_cd: item.stk_cd,
            stk_nm: item.stk_nm,
            cur_prc: Math.abs(parseFloat(item.cur_prc)),
            flu_rt: parseFloat(item.flu_rt),
            mac: parseInt(item.mac),
          }));

          allResults = allResults.concat(items);

          if (resContYn === "Y" && resNextKey && pageCount < maxPages) {
            contYn = "Y";
            nextKey = resNextKey;
            pageCount++;
            await delay(1200);
          } else {
            break;
          }
        }
        return allResults;
      }

      // 3. GitHub 미장 JSON 불러오기
      async function fetchAmericaSectorJSON() {
        const url = "https://jungjc1117.github.io/americaSector/%EB%AF%B8%EC%9E%A5.json";
        const res = await fetch(url);
        if (!res.ok) throw new Error(`미장 JSON 불러오기 실패: ${res.status}`);
        return await res.json();
      }

      function getRateClass(rate) {
        if (rate > 0) return "up";
        if (rate < 0) return "down";
        return "flat";
      }

      // 특정 지수 Key("S&P 500", "NASDAQ", "DOW", "SOX")의 테이블 HTML 생성 함수
      function buildIndexTableHTML(indexKey, indexTitle, sectorList, apiStockMap) {
        const targets = sectorList.filter(item => item[indexKey] === "O");
        const hierarchy = {};

        // 계층적 구조 빌드 (Sector -> Industry -> Stocks)
        targets.forEach(target => {
          const ticker = target["종목코드"];
          const apiData = apiStockMap.get(ticker);

          if (apiData && apiData.mac > 0) {
            const sector = target.Sector || "기타 섹터";
            const industry = target.Industry || "기타 산업";

            if (!hierarchy[sector]) hierarchy[sector] = {};
            if (!hierarchy[sector][industry]) hierarchy[sector][industry] = [];

            hierarchy[sector][industry].push({
              ticker: ticker,
              name: target["종목명"] || apiData.stk_nm,
              flu_rt: apiData.flu_rt,
              mac: apiData.mac
            });
          }
        });

        // 1. Sector별 가중평균 등락률 사전 계산 및 객체 구성
        const sectorDataList = [];

        Object.keys(hierarchy).forEach(sectorName => {
          const industries = hierarchy[sectorName];
          let sectorTotalMac = 0;
          let sectorWeightedSum = 0;

          Object.values(industries).forEach(stockList => {
            stockList.forEach(stk => {
              sectorTotalMac += stk.mac;
              sectorWeightedSum += (stk.flu_rt * stk.mac);
            });
          });

          const sectorAvgRate = sectorTotalMac > 0 ? (sectorWeightedSum / sectorTotalMac) : 0;

          sectorDataList.push({
            sectorName,
            sectorAvgRate,
            industries
          });
        });

        // 2. Sector 가중평균 등락률 내림차순 정렬
        sectorDataList.sort((a, b) => b.sectorAvgRate - a.sectorAvgRate);

        // 3. HTML 생성
        let html = `
          <div class="index-card">
            <h2 class="index-title">${indexTitle}</h2>
            <table>
              <thead>
                <tr>
                  <th>구분</th>
                  <th class="text-right">등락률</th>
                </tr>
              </thead>
              <tbody>
        `;

        if (sectorDataList.length === 0) {
          html += `<tr><td colspan="2" style="text-align:center;">해당 지수 데이터가 없습니다.</td></tr>`;
        }

        // 정렬된 Sector 순회
        sectorDataList.forEach(secItem => {
          const { sectorName, sectorAvgRate, industries } = secItem;
          const sectorRateClass = getRateClass(sectorAvgRate);

          // Sector Row (이중실선)
          html += `
            <tr class="sector-row">
              <td>📁 ${sectorName}</td>
              <td class="text-right ${sectorRateClass}">${sectorAvgRate.toFixed(2)}%</td>
            </tr>
          `;

          // Industry 순회
          Object.keys(industries).sort().forEach(industryName => {
            const stockList = industries[industryName];
            let indTotalMac = 0;
            let indWeightedSum = 0;

            stockList.forEach(stk => {
              indTotalMac += stk.mac;
              indWeightedSum += (stk.flu_rt * stk.mac);
            });

            const indAvgRate = indTotalMac > 0 ? (indWeightedSum / indTotalMac) : 0;
            const indRateClass = getRateClass(indAvgRate);

            // Industry Row (단일실선, 글자 작게)
            html += `
              <tr class="industry-row">
                <td class="indent-1">📂 ${industryName}</td>
                <td class="text-right ${indRateClass}">${indAvgRate.toFixed(2)}%</td>
              </tr>
            `;

            // 종목 순회 (종목 등락률 내림차순 정렬, 글자 더 작게)
            stockList.sort((a, b) => b.flu_rt - a.flu_rt).forEach(stk => {
              const stockRateClass = getRateClass(stk.flu_rt);
              html += `
                <tr class="stock-row">
                  <td class="indent-2">📄 <strong>${stk.ticker}</strong> (${stk.name})</td>
                  <td class="text-right ${stockRateClass}">${stk.flu_rt.toFixed(2)}%</td>
                </tr>
              `;
            });
          });
        });

        html += `
              </tbody>
            </table>
          </div>
        `;

        return html;
      }

      // 전체 처리 및 렌더링
      async function processAndRender() {
        try {
          updateTimestamp("데이터를 연동하고 있습니다...");
          const token = await fetchToken();
          await delay(800);

          const [apiStocks, sectorList] = await Promise.all([
            fetchCapitalUSA(token),
            fetchAmericaSectorJSON()
          ]);

          const apiStockMap = new Map();
          apiStocks.forEach(item => apiStockMap.set(item.stk_cd, item));

          // 4개 지수 대상 리스트
          const indices = [
            { key: "S&P 500", title: "S&P 500" },
            { key: "NASDAQ",  title: "NASDAQ" },
            { key: "DOW",     title: "DOW JONES" },
            { key: "SOX",     title: "SOX (필라델피아 반도체)" }
          ];

          let fullGridHTML = `<div class="index-grid-container">`;

          indices.forEach(idx => {
            fullGridHTML += buildIndexTableHTML(idx.key, idx.title, sectorList, apiStockMap);
          });

          fullGridHTML += `</div>`;

          document.getElementById("output").innerHTML = fullGridHTML;
          updateTimestamp();

        } catch (e) {
          console.error(e);
          document.getElementById("output").innerHTML = `
            <div class="error">데이터 로딩 중 에러가 발생했습니다: ${e.message}</div>
          `;
        }
      }

      // 실행
      processAndRender();
    </script>
  </body>
</html>
